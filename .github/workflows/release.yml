name: Verify Windows portable release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run action-parity:check-generated
      - run: npm run action-parity:verify
      - run: npm run prepare:windows
      - run: npm run test:win-console
      - run: npm run dist:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run smoke:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: u-dsh-portable-windows-x64
          path: dist/U-DSH-DeepSeek-Harness-Portable-*-Windows-x64.zip
