name: Verify Windows portable release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run action-parity:check-generated
      - run: npm run action-parity:verify
      - run: npm run prepare:vendor
        env:
          # 和 WebUI 流水线保持一致：用仓库里提交的确定性闭包锁，避免 npm 时间窗导致 peer 不收敛
          UDSH_VENDOR_LOCK: config/webui-closure
          UDSH_VENDOR_WEB_UI: '1'
      - run: npm run prepare:windows
      - run: npm run test:win-console
      - run: npm run dist:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run smoke:packaged
      # 安装器形态（官方那种体验）：一个 Setup.exe 装到本机，U 盘只放安装包
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: u-dsh-portable-windows-x64
          path: |
            dist/U-DSH-DeepSeek-Harness-Portable-*-Windows-x64.zip
            dist/U-DSH-DeepSeek-Harness-Portable-*-Windows-x64.exe
            dist/*Setup*.exe
